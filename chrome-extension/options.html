<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ContractOps Quick Capture — Settings</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        max-width: 480px;
        margin: 40px auto;
        color: #1b2733;
      }
      h1 { font-size: 16px; }
      h1 .accent { color: #ec7211; }
      label { display: block; font-size: 12px; font-weight: 600; color: #4b5a68; margin-bottom: 6px; }
      input {
        width: 100%;
        padding: 8px;
        font-size: 13px;
        border: 1px solid #c7d0d8;
        border-radius: 4px;
        margin-bottom: 12px;
      }
      button {
        padding: 8px 16px;
        background: #ec7211;
        color: #fff;
        border: none;
        border-radius: 4px;
        font-weight: 700;
        cursor: pointer;
      }
      .saved { color: #16825d; font-size: 12px; margin-left: 10px; }
      p.hint { color: #4b5a68; font-size: 12px; line-height: 1.5; }
    </style>
  </head>
  <body>
    <h1>Contract<span class="accent">Ops</span> Quick Capture</h1>
    <p class="hint">
      This is only used to build the "Open in ContractOps" link after saving a contract.
      Your sign-in and data always go straight to the ContractOps database, regardless of this setting.
    </p>
    <label>App URL
      <input type="url" id="app-url" placeholder="https://your-app.vercel.app" />
    </label>
    <button id="save">Save</button>
    <span id="saved" class="saved" style="display:none">Saved</span>

    <script src="config.js"></script>
    <script src="options.js"></script>
  </body>
</html>
